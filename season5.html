const CHAMPION = p(9,'dqi','HE');

// ── Layout ─────────────────────────────────────────────────────────────────────
// The R16 rows use the engine's default BAND / SIDE_H.

function render() {
  const w_game1 = buildMatch('game1', null, null, true, true);
  const w_game2 = buildMatch('game2', null, null, true, true);
  const w_game3 = buildMatch('game3', null, null, true, true);
  const w_game4 = buildMatch('game4', null, null, true, true);
  const w_game5 = buildMatch('game5', null, null, true, true);
  const w_game6 = buildMatch('game6', null, null, true, true);
  const w_game7 = buildMatch('game7', null, null, true, true);
  const w_game8 = buildMatch('game8', null, null, true, true);

  const w_game9 = buildMatch('game9', null,              w_game1._topEl, true,  false);
  const w_game10  = buildMatch('game10',  null,             w_game2._topEl, true,  false);
  const w_game11 = buildMatch('game11', null,              w_game3._topEl, true,  false);
  const w_game12 = buildMatch('game12', null,              w_game4._topEl, true,  false);
  const w_game13 = buildMatch('game13', null,              w_game5._topEl, true,  false);
  const w_game14 = buildMatch('game14', null,              w_game6._topEl, true,  false);
  const w_game15 = buildMatch('game15', null,              w_game7._topEl, true,  false);
  const w_game16 = buildMatch('game16', null,              w_game8._topEl, true,  false);

  const w_game17 = buildMatch('game17', w_game9._topEl,  w_game10._botEl,  false, false);
  const w_game18  = buildMatch('game18',  w_game11._topEl,  w_game12._topEl, false, false);
  const w_game19  = buildMatch('game19',  w_game13._botEl,  w_game14._botEl, false, false);
  const w_game20 = buildMatch('game20', w_game15._topEl,  w_game16._topEl, false, false);

  const w_game21 = buildMatch('game21', w_game17._botEl,  w_game18._botEl,  false, false);
  const w_game22 = buildMatch('game22', w_game19._topEl,   w_game20._botEl, false, false);

  const w_game23   = buildMatch('game23',   w_game21._topEl,  w_game22._topEl, false, false);

  // Position calculations
  const r2Tops = r16TopPx();

  const p_game1 = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game2 = playInTopFromCentre(r16SlotCentre(r2Tops, 1, false));
  const p_game3 = playInTopFromCentre(r16SlotCentre(r2Tops, 2, false));
  const p_game4 = playInTopFromCentre(r16SlotCentre(r2Tops, 3, false));
  const p_game5 = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game6 = playInTopFromCentre(r16SlotCentre(r2Tops, 1, false));
  const p_game7 = playInTopFromCentre(r16SlotCentre(r2Tops, 2, false));
  const p_game8 = playInTopFromCentre(r16SlotCentre(r2Tops, 3, false));

  const p_game17 = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game18  = centredBetweenMatches(r2Tops[2], r2Tops[3]);
  const p_game19  = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game20 = centredBetweenMatches(r2Tops[2], r2Tops[3]);

  const p_game21 = centredBetweenMatches(p_game17, p_game18);
  const p_game22 = centredBetweenMatches(p_game19,  p_game20);

  const colH = SIDE_H;

  // Left columns
  const colL_r1 = buildCol('Play-In', colH);
  addToCol(colL_r1, w_game1, p_game1);
  addToCol(colL_r1, w_game2, p_game2);
  addToCol(colL_r1, w_game3, p_game3);
  addToCol(colL_r1, w_game4, p_game4);

  const colL_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colL_r2, [w_game9, w_game10, w_game11, w_game12][i], top));

  const colL_r3 = buildCol('Quarterfinal', colH);
  addToCol(colL_r3, w_game17, p_game17);
  addToCol(colL_r3, w_game18,  p_game18);

  const colL_r4 = buildCol('Semifinal', colH);
  addToCol(colL_r4, w_game21, p_game21);

  // Right columns
  const colR_r1 = buildCol('Play-In', colH);
  addToCol(colR_r1, w_game5, p_game5);
  addToCol(colR_r1, w_game6, p_game6);
  addToCol(colR_r1, w_game7, p_game7);
  addToCol(colR_r1, w_game8, p_game8);

  const colR_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colR_r2, [w_game13, w_game14, w_game15, w_game16][i], top));

  addToCol(colR_r3, w_game19,  p_game19);
  addToCol(colR_r3, w_game20, p_game20);

  const colR_r4 = buildCol('Semifinal', colH);
  addToCol(colR_r4, w_game22, p_game22);

  mountBracket(
    [colL_r1, colL_r2, colL_r3, colL_r4],
    [colR_r1, colR_r2, colR_r3, colR_r4],
    w_game23
