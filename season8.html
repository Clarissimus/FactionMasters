// ── Factions ───────────────────────────────────────────────────────────────────
// Add any new faction abbreviations here as they come up this season.
const F = {
  DG:'Deepwood Groaks', FD:'Fungal Dwarves',   VG:'Vanguards',
  FK:'Fallen Kingdom',  CO:'Crimson Order',    FO:'The Forged',
  MV:'Mountain Vargath',EC:'Eternal Council',  PE:'Phoenix Elves',
  WF:'Wayfarers',       SO:'Swamp Orcs',       CL:'Cloaks',
  PD:'Fungal Dwarves',  CG:'Cave Goblins',     TO:'Tundra Orcs',
  SE:'Savanna Elves',   OD:'Obsidian Dwarves', SH:'Shadow Elves',
  HE:'High Elves',      SA:'Skyspear Avians',  SG:'Sand Goblins',
  BR:'Breakers',        ST:'Storm Goblins',    SF:'Shimmersea Fae',

// ── Match data ─────────────────────────────────────────────────────────────────
// HOW TO FILL THIS IN AS THE SEASON PROGRESSES:
//   • A competitor becomes known → replace that slot's `null` with
//       p(seed, 'Name', 'FAC')
//   • A match gets played → add `winner: <seed>` and `yt: 'https://youtu.be/...'`
//     to that match's entry.
//   • A match is a faction-alliance / no-game situation → add `type: 'no_game'`
//     instead of a `yt` link (renders "No Game Played").
//   • Once you know a match's winner, open render() below and check that the
//     *next* match's source argument for that slot points at the correct
//     winner element — `._topEl` if the winner sits in the top slot of the
//     feeder match, `._botEl` if it sits in the bottom slot. Right now every
//     source below defaults to `._topEl` as a placeholder since no winners
//     are known yet. (Happy to update this wiring for you each time you have
//     a result to add — just paste me the match outcome.)
//
// Assumes 30 competitors (32-slot bracket, 2 byes for seeds 1 & 2, 14 play-in
// matches). If the real seeding ends up different, the match *data* is easy
// to edit — just flag it and I can help adjust the *structure* (row layout /
// column heights) if the shape itself needs to change.

const MATCHES = {
  // Play-in — left side (seeds feeding R16 groups 1,8,4,5)
  game1:  { top:p(16,'LCANELA','VG'),      bot:p(17,'excile2127','IV') },
  game2:  { top:p(8,'Ratatosk','CL'),      bot:p(25,'CH4MP','VG') },
  game3:  { top:p(9,'DeadSans','BR'),      bot:p(24,'Nozy','OD') },
  game4:  { top:p(4,'Kezbatron','SC'),      bot:p(29,'SneezingMerilous','EC') },
  game5:  { top:p(13,'Astrowild','FL'),      bot:p(20,'rdebruys83','HE') },
  game6:  { top:p(5,'TastyTeddyBear','SE'),      bot:p(28,'Woof','WF') },
  game7:  { top:p(12,'MajesticOnions','FK'),      bot:p(21,'Orange Lazarus','FD') },
  // Play-in — right side (seeds feeding R16 groups 2,7,3,6)
  game8:  { top:p(15,'Nozy','CH'),      bot:p(18,'DeadSans','CG') },
  game9:  { top:p(7,'MajesticOnions','CL'),      bot:p(26,'tortugatron','SA') },
  game10: { top:p(10,'CH4MP','PE'),      bot:p(23,'Nozy','OD') },
  game11: { top:p(3,'Monk3ylord','CO'),      bot:p(30,'Ratatosk','PD') },
  game12: { top:p(14,'CH4MP','SH'),      bot:p(19,'excile2127','MV') },
  game13: { top:p(6,'Aksyriel','DR'),      bot:p(27,'DrWolf','DG') },
  game14: { top:p(11,'excile2127','SF'),      bot:p(22,'Milbo','ST') },
  // Round of 16 — left (seeds 1,8,4,5). Only seed 1 has a bye this season
  // (top slot of game15) — the other three left rows are two play-in
  // winners each (no bye available).
  game15: { top:p(1, 'Askyriel', 'GD'), bot: null },
  game16: { top: null, bot: null },
  game17: { top: null, bot: null },
  game18: { top: null, bot: null },
  // Round of 16 — right (seeds 2,7,3,6). Only seed 2 has a bye (top slot

  game19: { top: p(2, 'excile2127', 'FO'), bot: null },
  game20: { top: null, bot: null },
  game21: { top: null, bot: null },
  game22: { top: null, bot: null },
  // Quarterfinals
  game23: { top: null, bot: null },
  game24: { top: null, bot: null },
  game25: { top: null, bot: null },
  game26: { top: null, bot: null },
  // Semifinals
  game27: { top: null, bot: null },
  game28: { top: null, bot: null },
  // Final
  game29: { top: null, bot: null },
};

const CHAMPION = null; // set to p(seed, 'Name', 'FAC') once the season concludes

// ── Layout ─────────────────────────────────────────────────────────────────────
// 30 competitors → 14 play-in matches (7 per side). Only the very first R16
// row on each side has a bye (seed 1 on the left, seed 2 on the right); the
// remaining three R16 rows per side each stack two play-in matches (one
// centred on the row's top slot, one on its bottom slot), same technique
// used in Season 7. R16/QF/SF/Final tiers use the engine's default BAND/SIDE_H.

function render() {
  // Play-in — left
  const w_game1 = buildMatch('game1', null, null, true, true);
  const w_game2 = buildMatch('game2', null, null, true, true);
  const w_game3 = buildMatch('game3', null, null, true, true);
  const w_game4 = buildMatch('game4', null, null, true, true);
  const w_game5 = buildMatch('game5', null, null, true, true);
  const w_game6 = buildMatch('game6', null, null, true, true);
  const w_game7 = buildMatch('game7', null, null, true, true);
  // Play-in — right
  const w_game8 = buildMatch('game8', null, null, true, true);
  const w_game9 = buildMatch('game9', null, null, true, true);
  const w_game10 = buildMatch('game10', null, null, true, true);
  const w_game11 = buildMatch('game11', null, null, true, true);
  const w_game12 = buildMatch('game12', null, null, true, true);
  const w_game13 = buildMatch('game13', null, null, true, true);
  const w_game14 = buildMatch('game14', null, null, true, true);

  // Round of 16 — left
  const w_game15 = buildMatch('game15', null,             w_game1._topEl, true,  false);
  const w_game16 = buildMatch('game16', w_game2._topEl,   w_game3._topEl, false, false);
  const w_game17 = buildMatch('game17', w_game4._topEl,   w_game5._topEl, false, false);
  const w_game18 = buildMatch('game18', w_game6._topEl,   w_game7._topEl, false, false);
  // Round of 16 — right
  const w_game19 = buildMatch('game19', null,             w_game8._topEl, true,  false);
  const w_game20 = buildMatch('game20', w_game9._topEl,   w_game10._topEl, false, false);
  const w_game21 = buildMatch('game21', w_game11._topEl,  w_game12._topEl, false, false);
  const w_game22 = buildMatch('game22', w_game13._topEl,  w_game14._topEl, false, false);

  // Quarterfinals
  const w_game23 = buildMatch('game23', w_game15._topEl, w_game16._topEl, false, false);
  const w_game24 = buildMatch('game24', w_game17._topEl, w_game18._topEl, false, false);
  const w_game25 = buildMatch('game25', w_game19._topEl, w_game20._topEl, false, false);
  const w_game26 = buildMatch('game26', w_game21._topEl, w_game22._topEl, false, false);

  // Semifinals
  const w_game27 = buildMatch('game27', w_game23._topEl, w_game24._topEl, false, false);
  const w_game28 = buildMatch('game28', w_game25._topEl, w_game26._topEl, false, false);

  // Final
  const w_game29 = buildMatch('game29', w_game27._topEl, w_game28._topEl, false, false);

  // Position calculations
  const r2Tops = r16TopPx();

  const p_game1 = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game2 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, true));
  const p_game3 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, false));
  const p_game4 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 2, true));
  const p_game5 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 2, false));
  const p_game6 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, true));
  const p_game7 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, false));

  const p_game8  = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game9  = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, true));
  const p_game10 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, false));
  const p_game11 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 2, true));
  const p_game12 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 2, false));
  const p_game13 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, true));
  const p_game14 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, false));

  const p_game23 = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game24 = centredBetweenMatches(r2Tops[2], r2Tops[3]);
  const p_game25 = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game26 = centredBetweenMatches(r2Tops[2], r2Tops[3]);

  const p_game27 = centredBetweenMatches(p_game23, p_game24);
  const p_game28 = centredBetweenMatches(p_game25, p_game26);

  const colH = SIDE_H;

  // Left columns
  const colL_r1 = buildCol('Play-In', colH);
  addToCol(colL_r1, w_game1, p_game1);
  addToCol(colL_r1, w_game2, p_game2);
  addToCol(colL_r1, w_game3, p_game3);
  addToCol(colL_r1, w_game4, p_game4);
  addToCol(colL_r1, w_game5, p_game5);
  addToCol(colL_r1, w_game6, p_game6);
  addToCol(colL_r1, w_game7, p_game7);

  const colL_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colL_r2, [w_game15, w_game16, w_game17, w_game18][i], top));

  const colL_r3 = buildCol('Quarterfinal', colH);
  addToCol(colL_r3, w_game23, p_game23);
  addToCol(colL_r3, w_game24, p_game24);

  const colL_r4 = buildCol('Semifinal', colH);
  addToCol(colL_r4, w_game27, p_game27);

  // Right columns
  const colR_r1 = buildCol('Play-In', colH);
  addToCol(colR_r1, w_game8, p_game8);
  addToCol(colR_r1, w_game9, p_game9);
  addToCol(colR_r1, w_game10, p_game10);
  addToCol(colR_r1, w_game11, p_game11);
  addToCol(colR_r1, w_game12, p_game12);
  addToCol(colR_r1, w_game13, p_game13);
  addToCol(colR_r1, w_game14, p_game14);

  const colR_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colR_r2, [w_game19, w_game20, w_game21, w_game22][i], top));

  const colR_r3 = buildCol('Quarterfinal', colH);
  addToCol(colR_r3, w_game25, p_game25);
  addToCol(colR_r3, w_game26, p_game26);

  const colR_r4 = buildCol('Semifinal', colH);
  addToCol(colR_r4, w_game28, p_game28);

  mountBracket(
    [colL_r1, colL_r2, colL_r3, colL_r4],
    [colR_r1, colR_r2, colR_r3, colR_r4],
    w_game29
  );
}
