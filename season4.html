<script>

// ── Match data ─────────────────────────────────────────────────────────────────
const MATCHES = {
  // Play-in
  game1: { top:p(16,'Gamebear','FD'),     bot:p(17,'Shampoo','VG'),      winner:16, yt:'https://youtu.be/o_gfoGQF1G8' },
  game4: { top:p(15,'Fiddleford','PD'),   bot:p(18,'Gamebear','CG'),     winner:18, yt:'https://youtu.be/fbfflQA0PHk' },

  game9:  { top:p(1,'Magnifico','DG'),     bot:p(16,'Gamebear','FD'),     winner:16, yt:'https://youtu.be/VM_RhX8uEE8' },
  game8:   { top:p(8,'Eerie','FK'),         bot:p(9,'Shmeebee','CO'),      winner:9,  yt:'https://youtu.be/QShP53nOgSg' },
  game10:  { top:p(4,'Vexer','FO'),         bot:p(20,'Eydir','EC'),        winner:4,  yt:'https://youtu.be/HMoElt-ngv8' },
  game11:  { top:p(5,'dqi','PE'),           bot:p(12,'ghhinman','WF'),     winner:5,  yt:'https://youtu.be/HubttW_TZX8' },
  // Round of 16 — right (seeds 2,7,3,6)
  game12:  { top:p(2,'BoldSerpent','CL'),   bot:p(18,'Gamebear','CG'),     winner:2,  yt:'https://youtu.be/09BgRRlNWvY' },
  r2_7_10:  { top:p(7,'Nesle','TO'),         bot:p(10,'PetarPvZ','SE'),     winner:7,  yt:null, type:'forfeit' },
  game13:  { top:p(3,'Jexik','OD'),         bot:p(19,'wwart1020','HE'),    winner:19, yt:'https://youtu.be/eW2HxhsipwE' },
  game14:  { top:p(6,'Devlinfish','SA'),    bot:p(22,'Matiaks','BR'),      winner:6,  yt:'https://youtu.be/luoVFuKt9rw' },
  // Quarterfinals
  game15:  { top:p(16,'Gamebear','FD'),     bot:p(9,'Shmeebee','CO'),      winner:16, yt:'https://youtu.be/2mq4rNmhHkE' },
  game16:   { top:p(4,'Vexer','FO'),         bot:p(5,'dqi','PE'),           winner:4,  yt:'https://youtu.be/0_QsoEAIXU0' },
  game17:   { top:p(2,'BoldSerpent','CL'),   bot:p(7,'Nesle','TO'),         winner:7,  yt:'https://youtu.be/9F2zl-lN74E' },
  game18:  { top:p(19,'wwart1020','HE'),    bot:p(6,'Devlinfish','SA'),    winner:19, yt:'https://youtu.be/WBJRoURJFI0' },
  // Semifinals
  game19:  { top:p(16,'Gamebear','FD'),     bot:p(4,'Vexer','FO'),         winner:4,  yt:'https://youtu.be/lfJ1KTtHZxc' },
  game20:  { top:p(7,'Nesle','TO'),         bot:p(19,'wwart1020','HE'),    winner:7,  yt:'https://youtu.be/w_w_krwZ3cs' },
  // Final
  game21:    { top:p(4,'Vexer','FO'),         bot:p(7,'Nesle','TO'),         winner:4,  yt:'https://youtu.be/TUSupAMTZiY' },
};

const CHAMPION = p(4, 'Vexer', 'FO');

// ── Layout ─────────────────────────────────────────────────────────────────────
// Season 4 has 3 play-in matches per side (not 4), so GAP is tighter.
// The R16 rows use the engine's default BAND / SIDE_H.

function render() {
  const w_game1 = buildMatch('game1', null, null, true, true);
  const w_game4 = buildMatch('game4', null, null, true, true);
  const w_game5 = buildMatch('game5', null, null, true, true);
  const w_game2 = buildMatch('game2', null, null, true, true);
  const w_game3 = buildMatch('game3', null, null, true, true);
  const w_game6 = buildMatch('game6', null, null, true, true);

  const w_game8 = buildMatch('game8', null,              w_game1._topEl, true,  false);
  const w_game9  = buildMatch('game9',  null,              null,              true,  true);
  const w_game10 = buildMatch('game10', null,              w_game2._botEl, true,  false);
  const w_game11 = buildMatch('game11', null,              w_game3._topEl, true,  false);
  const w_game12 = buildMatch('game12', null,              w_game4._botEl, true,  false);
  const w_r2_7_10 = buildMatch('r2_7_10', null,              null,              true,  true);
  const w_game13 = buildMatch('game13', null,              w_game5._botEl, true,  false);
  const w_game14 = buildMatch('game14', null,              w_game6._botEl, true,  false);

  const w_game15 = buildMatch('game15', w_game7._botEl,  w_game8._botEl,  false, false);
  const w_game16  = buildMatch('game16',  w_game9._topEl,  w_game10._topEl, false, false);
  const w_game17  = buildMatch('game17',  w_game12._topEl,  w_r2_7_10._topEl, false, false);
  const w_game18 = buildMatch('game18', w_game13._botEl,  w_game14._topEl, false, false);

  const w_game19 = buildMatch('game19', w_game15._topEl,  w_game16._topEl,  false, false);
  const w_game20 = buildMatch('game20', w_game17._botEl,   w_game18._topEl, false, false);

  const w_game21   = buildMatch('game21',   w_game19._botEl,  w_game20._topEl, false, false);

  // Position calculations
  const r2Tops = r16TopPx();

  const p_game1 = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game2 = playInTopFromCentre(r16SlotCentre(r2Tops, 2, false));
  const p_game3 = playInTopFromCentre(r16SlotCentre(r2Tops, 3, false));
  const p_game4 = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game5 = playInTopFromCentre(r16SlotCentre(r2Tops, 2, false));
  const p_game6 = playInTopFromCentre(r16SlotCentre(r2Tops, 3, false));

  const p_game15 = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game16  = centredBetweenMatches(r2Tops[2], r2Tops[3]);
  const p_game17  = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game18 = centredBetweenMatches(r2Tops[2], r2Tops[3]);

  const p_game19 = centredBetweenMatches(p_game15, p_game16);
  const p_game20 = centredBetweenMatches(p_game17,  p_game18);

  const colH = SIDE_H;

  // Left columns
  const colL_r1 = buildCol('Play-In', colH);
  addToCol(colL_r1, w_game1, p_game1);
  addToCol(colL_r1, w_game2, p_game2);
  addToCol(colL_r1, w_game3, p_game3);

  const colL_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colL_r2, [w_game7, w_game8, w_game9, w_game10][i], top));

  const colL_r3 = buildCol('Quarterfinal', colH);
  addToCol(colL_r3, w_game15, p_game15);
  addToCol(colL_r3, w_game16,  p_game16);

  const colL_r4 = buildCol('Semifinal', colH);
  addToCol(colL_r4, w_game19, p_game19);

  // Right columns
  const colR_r1 = buildCol('Play-In', colH);
  addToCol(colR_r1, w_game4, p_game4);
  addToCol(colR_r1, w_game5, p_game5);
  addToCol(colR_r1, w_game6, p_game6);

  const colR_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colR_r2, [w_game12, w_r2_7_10, w_game13, w_game14][i], top));

  const colR_r3 = buildCol('Quarterfinal', colH);
  addToCol(colR_r3, w_game17,  p_game17);
  addToCol(colR_r3, w_game18, p_game18);

  const colR_r4 = buildCol('Semifinal', colH);
  addToCol(colR_r4, w_game20, p_game20);

  mountBracket(
    [colL_r1, colL_r2, colL_r3, colL_r4],
    [colR_r1, colR_r2, colR_r3, colR_r4],
    w_game21
  );
}
</script>
