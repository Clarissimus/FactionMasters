const CHAMPION = p(5,'excile2127','MV');

// ── Layout ─────────────────────────────────────────────────────────────────────
// Season 7 has 6 play-in matches per side. R16 rows 1 and 3 (0-indexed) on each
// side have no bye — both slots come from play-in winners — so two play-in
// matches stack on each of those rows (one centred on the row's top slot,
// one on its bottom slot). Rows 0 and 2 keep the usual bye + single play-in.
// R16/QF/SF/Final tiers still use the engine's default BAND / SIDE_H.

function render() {
  // Play-in — left
  const w_game1 = buildMatch('game1', null, null, true, true);
  const w_game2 = buildMatch('game2', null, null, true, true);
  const w_game3 = buildMatch('game3', null, null, true, true);
  const w_game4 = buildMatch('game4', null, null, true, true);
  const w_game5 = buildMatch('game5', null, null, true, true);
  const w_game6 = buildMatch('game6', null, null, true, true);
  // Play-in — right
  const w_game7 = buildMatch('game7', null, null, true, true);
  const w_game8 = buildMatch('game8', null, null, true, true);
  const w_game9 = buildMatch('game9', null, null, true, true);
  const w_game10 = buildMatch('game10', null, null, true, true);
  const w_game11 = buildMatch('game11', null, null, true, true);
  const w_game12 = buildMatch('game12', null, null, true, true);

  // Round of 16 — left
  const w_game13 = buildMatch('game13', null,             w_game1._botEl, true,  false);
  const w_game14 = buildMatch('game14', w_game2._botEl,   w_game3._topEl, false, false);
  const w_game15 = buildMatch('game15', null,             w_game4._botEl, true,  false);
  const w_game16 = buildMatch('game16', w_game5._topEl,   w_game6._botEl, false, false);
  // Round of 16 — right
  const w_game17 = buildMatch('game17', null,             w_game7._topEl, true,  false);
  const w_game18 = buildMatch('game18', w_game8._topEl,   w_game9._topEl, false, false);
  const w_game19 = buildMatch('game19', null,             w_game10._topEl, true, false);
  const w_game20 = buildMatch('game20', w_game11._botEl,  w_game12._botEl, false, false);

  // Quarterfinals
  const w_game21 = buildMatch('game21', w_game13._topEl, w_game14._topEl, false, false);
  const w_game22 = buildMatch('game22', w_game15._topEl, w_game16._topEl, false, false);
  const w_game23 = buildMatch('game23', w_game17._botEl, w_game18._topEl, false, false);
  const w_game24 = buildMatch('game24', w_game19._topEl, w_game20._botEl, false, false);

  // Semifinals
  const w_game25 = buildMatch('game25', w_game21._topEl, w_game22._topEl, false, false);
  const w_game26 = buildMatch('game26', w_game23._botEl, w_game24._botEl, false, false);

  // Final
  const w_game27 = buildMatch('game27', w_game25._botEl, w_game26._topEl, false, false);

  // Position calculations
  const r2Tops = r16TopPx();

  const p_game1 = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game2 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, true));
  const p_game3 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, false));
  const p_game4 = playInTopFromCentre(r16SlotCentre(r2Tops, 2, false));
  const p_game5 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, true));
  const p_game6 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, false));

  const p_game7  = playInTopFromCentre(r16SlotCentre(r2Tops, 0, false));
  const p_game8  = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, true));
  const p_game9  = playInTopFromCentre(stackedPlayInCentre(r2Tops, 1, false));
  const p_game10 = playInTopFromCentre(r16SlotCentre(r2Tops, 2, false));
  const p_game11 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, true));
  const p_game12 = playInTopFromCentre(stackedPlayInCentre(r2Tops, 3, false));

  const p_game21 = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game22 = centredBetweenMatches(r2Tops[2], r2Tops[3]);
  const p_game23 = centredBetweenMatches(r2Tops[0], r2Tops[1]);
  const p_game24 = centredBetweenMatches(r2Tops[2], r2Tops[3]);

  const p_game25 = centredBetweenMatches(p_game21, p_game22);
  const p_game26 = centredBetweenMatches(p_game23, p_game24);

  const colH = SIDE_H;

  // Left columns
  const colL_r1 = buildCol('Play-In', colH);
  addToCol(colL_r1, w_game1, p_game1);
  addToCol(colL_r1, w_game2, p_game2);
  addToCol(colL_r1, w_game3, p_game3);
  addToCol(colL_r1, w_game4, p_game4);
  addToCol(colL_r1, w_game5, p_game5);
  addToCol(colL_r1, w_game6, p_game6);

  const colL_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colL_r2, [w_game13, w_game14, w_game15, w_game16][i], top));

  const colL_r3 = buildCol('Quarterfinal', colH);
  addToCol(colL_r3, w_game21, p_game21);
  addToCol(colL_r3, w_game22, p_game22);

  const colL_r4 = buildCol('Semifinal', colH);
  addToCol(colL_r4, w_game25, p_game25);

  // Right columns
  const colR_r1 = buildCol('Play-In', colH);
  addToCol(colR_r1, w_game7, p_game7);
  addToCol(colR_r1, w_game8, p_game8);
  addToCol(colR_r1, w_game9, p_game9);
  addToCol(colR_r1, w_game10, p_game10);
  addToCol(colR_r1, w_game11, p_game11);
  addToCol(colR_r1, w_game12, p_game12);

  const colR_r2 = buildCol('Round of 16', colH);
  r2Tops.forEach((top, i) => addToCol(colR_r2, [w_game17, w_game18, w_game19, w_game20][i], top));

  const colR_r3 = buildCol('Quarterfinal', colH);
  addToCol(colR_r3, w_game23, p_game23);
  addToCol(colR_r3, w_game24, p_game24);

  const colR_r4 = buildCol('Semifinal', colH);
  addToCol(colR_r4, w_game26, p_game26);

  mountBracket(
    [colL_r1, colL_r2, colL_r3, colL_r4],
    [colR_r1, colR_r2, colR_r3, colR_r4],
    w_game27
  );
}
